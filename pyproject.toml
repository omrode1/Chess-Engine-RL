[project]
name = "chess-rl"
version = "0.2.0.dev0"
description = "A laptop-trained chess engine built to beat one specific human by modelling them."
readme = "README.md"
license = "MIT"
authors = [{ name = "Om Rode" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "chess>=1.11,<2",
    "numpy>=1.26,<2",            # gym 0.23 does not support NumPy 2; lifted after the gymnasium migration
    "gym==0.23.1",               # legacy v0 pipeline only; replaced by gymnasium
    "shimmy>=2.0,<3",            # lets SB3 2.x wrap old-gym environments
    "stable-baselines3>=2.5,<3",
    "torch==2.14.1",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "tensorboard>=2.17",
    "pyyaml>=6",
]

[project.scripts]
chess-rl = "chess_rl.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# chess_rl is the product. baseline/ holds the frozen v0 code, removed in M5 (#27).
packages = ["src/chess_rl", "baseline"]

[project.optional-dependencies]
# Pick exactly one: `uv sync --extra cu130` (RTX 3050 laptop) or `uv sync --extra cpu` (CI, no GPU).
cpu = ["torch==2.14.1"]
cu130 = ["torch==2.14.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",    # long lines are handled by the formatter; remaining ones are strings/comments
    "SIM102",  # nested ifs are often clearer than one long condition
]

[tool.ruff.lint.isort]
known-first-party = ["chess_rl", "baseline", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
timeout = 300  # no test may hang CI; a stuck test fails with a traceback
markers = ["slow: multi-second training runs"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*Gym has been unmaintained.*",
    "ignore:You provided an OpenAI Gym environment.*:UserWarning",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
