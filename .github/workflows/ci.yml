name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu
      - name: Cache pinned Stockfish
        uses: actions/cache@v6
        with:
          path: ~/.local/share/chess-rl/stockfish
          key: stockfish-${{ hashFiles('src/chess_rl/eval/stockfish.py') }}
      - run: uv run --no-sync chess-rl stockfish install
      - run: uv run --no-sync pytest
        env:
          CHESS_RL_REQUIRE_STOCKFISH: "1"  # fail instead of skipping Stockfish tests
